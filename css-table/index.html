<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bảng trong CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            height: 50px;
            text-align: left;
            background-color: green;
            color: white;
            padding: 10px;
        }

        td {
            height: 50px;
            vertical-align: bottom;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Bảng trong CSS</h1>

    <table>
        <tr>
            <th>Họ và tên</th>
            <th>Tuổi</th>
            <th>Quê quán</th>
        </tr>

        <tr>
            <td>Nguyễn Văn An</td>
            <td>20</td>
            <td>Hà Nội</td>
        </tr>

        <tr>
            <td>Trần Thị Bình</td>
            <td>21</td>
            <td>Thái Nguyên</td>
        </tr>

        <tr>
            <td>Lê Văn Nam</td>
            <td>22</td>
            <td>Hà Giang</td>
        </tr>

    </table>

</body>
</html>
